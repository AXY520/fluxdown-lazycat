name: lazycat-store-publish

on:
  schedule:
    # 每 6 小时检查一次各应用上游 release（分钟值错开整点）
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      app:
        description: "应用名（all = 全部）"
        type: string
        default: "all"
      force:
        description: "强制重走发布流程（补发）"
        type: boolean
        default: false

permissions:
  contents: write # 发布后把各应用状态提交回仓库

concurrency:
  group: lazycat-store-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      LAZYCAT_APPSTORE_USER: ${{ secrets.LAZYCAT_APPSTORE_USER }}
      LAZYCAT_APPSTORE_PASS: ${{ secrets.LAZYCAT_APPSTORE_PASS }}
      FORCE: ${{ inputs.force && '1' || '0' }}
      SELECTED_APP: ${{ inputs.app || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lzc-cli
        run: npm install -g @lazycatcloud/lzc-cli

      - name: Sync apps
        run: |
          set -o pipefail
          echo "| 应用 | 结果 | 说明 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for d in apps/*/; do
            app="$(basename "$d")"
            if [ "$SELECTED_APP" != all ] && [ "$SELECTED_APP" != "$app" ]; then continue; fi
            log="logs-$app.txt"
            if scripts/sync.sh "$app" 2>&1 | tee "$log"; then
              st="✅"
            else
              st="❌"; fail=1
            fi
            note="$(grep -oE 'RESULT: .*' "$log" | tail -1 | sed 's/^RESULT: //' | cut -c1-120 | sed 's/|/∣/g')"
            echo "| $app | $st | ${note:--} |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"

      - name: Upload lpk artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpk-${{ github.run_id }}
          path: "apps/*/*.lpk"
          if-no-files-found: ignore
