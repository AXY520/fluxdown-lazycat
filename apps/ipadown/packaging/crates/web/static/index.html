<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>ipaDown</title>
<style>
  :root,[data-theme="dark"] {
    --ui-bg:#06080d; --ui-surface:rgba(25,29,39,.62); --ui-raised:rgba(35,40,52,.76); --ui-hover:rgba(71,79,99,.52); --ui-input:rgba(53,60,76,.54);
    --ui-border:rgba(255,255,255,.16); --ui-border-subtle:rgba(255,255,255,.08);

    --ui-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05); --ui-backdrop:rgba(0,0,0,.42); --ui-focus:0 0 0 3px rgba(10,132,255,.34);

    --ui-shadow:0 12px 30px rgba(60,74,100,.12),inset 0 1px 0 rgba(255,255,255,.76); --ui-backdrop:rgba(25,35,52,.24); --ui-focus:0 0 0 3px rgba(0,122,255,.25);
  }
  *,*::before,*::after { box-sizing:border-box; }
  * { scrollbar-width:none; -ms-overflow-style:none; }
  *::-webkit-scrollbar { display:none; width:0; height:0; }
  html { color-scheme:dark; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html[data-theme="light"] { color-scheme:light; }
  body {
    margin:0; min-height:100vh; overflow-x:hidden; color:var(--ui-text);
    background:
      radial-gradient(circle at 18% 4%,rgba(10,132,255,.20),transparent 34rem),
      radial-gradient(circle at 86% 72%,rgba(92,71,255,.13),transparent 32rem),var(--ui-bg);

    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; transition:background var(--ui-normal),color var(--ui-normal);
  }
  html.modal-open,body.modal-open { overflow:hidden; overscroll-behavior:none; }
  body.modal-open { width:100%; }
  body.browser-checking > header,body.browser-checking > main,body.browser-checking > .tab-bar,
  body.browser-blocked > header,body.browser-blocked > main,body.browser-blocked > .tab-bar { display:none; }
  button,input { font:inherit; touch-action:manipulation; }
  button { -webkit-tap-highlight-color:transparent; }
  code { padding:2px 7px; border-radius:7px; background:var(--ui-input); font-size:12px; overflow-wrap:anywhere; }
  .hidden { display:none !important; }
  .dim { color:var(--ui-muted); }

  .browser-gate {

  }
  .browser-gate-card {
    width:min(420px,100%); padding:24px; text-align:center; background:var(--ui-surface);
    border:1px solid var(--ui-border); border-radius:var(--ui-radius-surface); box-shadow:var(--ui-shadow);
    backdrop-filter:blur(24px) saturate(160%); -webkit-backdrop-filter:blur(24px) saturate(160%);
  }
  .browser-gate-icon { width:52px; height:52px; margin:0 auto 13px; display:grid; place-items:center; border-radius:14px; background:var(--ui-accent-soft); font-size:28px; }
  .browser-gate h1 { margin:0 0 6px; font-size:19px; }
  .browser-gate p { margin:0; color:var(--ui-muted); }
  .browser-gate-address { margin-top:16px; padding:6px; display:flex; align-items:center; gap:8px; border:1px solid var(--ui-border-subtle); border-radius:11px; background:var(--ui-input); text-align:left; }
  .browser-gate-address code { flex:1; min-width:0; padding:4px 6px; background:transparent; color:var(--ui-text); }
  .browser-gate-address button { flex:none; min-width:66px; }
  .debug-notice {
    margin-top:14px; padding:8px 11px; border:1px solid color-mix(in srgb,var(--ui-accent) 30%,transparent);
    border-radius:9px; color:var(--ui-accent); background:var(--ui-accent-soft); font-size:12px;
  }

  header.nav {
    position:sticky; top:0; z-index:40; border-bottom:1px solid var(--ui-border-subtle);
    background:var(--ui-nav); backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
  }
  .nav-inner { width:min(820px,100%); min-height:52px; margin:auto; padding:7px 18px; display:flex; align-items:center; gap:8px; }
  .logo { font-size:18px; }
  .brand { font-size:16px; font-weight:750; }
  .spacer { flex:1; }
  main { width:min(820px,100%); margin:auto; padding:10px 18px max(118px,calc(96px + env(safe-area-inset-bottom))); }
  section { margin-top:16px; }
  .page-heading { min-height:40px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .sec-title { margin:0; font-size:22px; line-height:1.2; font-weight:750; }
  .card {
    position:relative; padding:13px 15px; border:1px solid var(--ui-border); border-radius:var(--ui-radius-surface);
    background:var(--ui-surface); box-shadow:var(--ui-shadow); backdrop-filter:blur(24px) saturate(155%); -webkit-backdrop-filter:blur(24px) saturate(155%);
  }
  .card + .card { margin-top:10px; }
  /* 展开下拉菜单时抬升层级，避免被相邻卡片（各自成层叠上下文）遮挡 */
  .card.menu-open { z-index:6; }

  input {
    width:100%; min-height:40px; padding:8px 11px; color:var(--ui-text); background:var(--ui-input);
    border:1px solid transparent; border-radius:var(--ui-radius-control); outline:none;
    transition:box-shadow var(--ui-fast),background var(--ui-normal),border-color var(--ui-fast);
  }
  input::placeholder { color:var(--ui-muted); }
  input:focus { border-color:var(--ui-accent); background:var(--ui-hover); box-shadow:var(--ui-focus); }
  button {
    min-height:36px; padding:6px 14px; border:0; border-radius:999px; color:#fff; background:var(--ui-accent);
    font-size:13px; font-weight:650; cursor:pointer; transition:opacity var(--ui-fast),transform 60ms,background var(--ui-normal);
  }
  button:hover { filter:brightness(1.06); }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.42; cursor:not-allowed; }
  button:focus-visible,input:focus-visible { outline:0; box-shadow:var(--ui-focus); }
  button.ghost { color:var(--ui-accent); background:var(--ui-accent-soft); }
  button.danger { color:var(--ui-danger); background:color-mix(in srgb,var(--ui-danger) 12%,transparent); }
  .theme-btn { width:36px; height:36px; min-height:36px; padding:0; display:grid; place-items:center; color:var(--ui-text); background:var(--ui-input); }
  .search-grid { display:grid; grid-template-columns:minmax(0,1fr) 130px auto; gap:8px; align-items:center; }
  .pill { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:999px; font-size:11px; color:var(--ui-muted); background:var(--ui-input); }

  .device-nav { position:relative; }
  .device-trigger {
    width:36px; height:36px; min-height:36px; padding:0; display:grid; place-items:center;
    color:var(--ui-text); background:var(--ui-input);
  }
  .device-trigger:hover,.device-trigger[aria-expanded="true"] { background:var(--ui-hover); filter:none; }
  .device-trigger[aria-expanded="true"] { box-shadow:var(--ui-focus); }
  .device-trigger svg,.device-menu-option svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .device-menu {
    position:absolute; z-index:90; top:calc(100% + 8px); right:0; width:184px; padding:6px;
    border:1px solid var(--ui-border); border-radius:13px; background:var(--ui-raised); box-shadow:var(--ui-shadow);
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
  }
  .device-menu-option {
    width:100%; min-height:42px; padding:8px 10px; display:grid; grid-template-columns:24px minmax(0,1fr) 16px; align-items:center; gap:8px;
    border-radius:9px; color:var(--ui-text); background:transparent; text-align:left; font-weight:550;
  }
  .device-menu-option:hover,.device-menu-option:focus-visible { background:var(--ui-hover); filter:none; }
  .device-menu-option.active { color:var(--ui-accent); background:var(--ui-accent-soft); }
  .device-check { opacity:0; font-weight:800; text-align:right; }
  .device-menu-option.active .device-check { opacity:1; }

  .custom-select { position:relative; min-width:0; }
  .select-trigger {
    width:100%; min-height:40px; padding:7px 10px 7px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    border:1px solid transparent; border-radius:var(--ui-radius-control); color:var(--ui-text); background:var(--ui-input); text-align:left;
  }
  .select-trigger:hover { background:var(--ui-hover); filter:none; }
  .select-trigger[aria-expanded="true"] { border-color:var(--ui-accent); box-shadow:var(--ui-focus); }
  .select-chevron { width:8px; height:8px; flex:none; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg) translateY(-2px); color:var(--ui-muted); }
  .select-menu {
    position:absolute; z-index:80; top:calc(100% + 7px); left:0; right:0; max-height:260px; padding:6px; overflow:auto;
    border:1px solid var(--ui-border); border-radius:var(--ui-radius-inner); background:var(--ui-raised); box-shadow:var(--ui-shadow);
    backdrop-filter:blur(28px) saturate(170%); -webkit-backdrop-filter:blur(28px) saturate(170%);
  }
  .select-option {
    width:100%; min-height:38px; padding:8px 10px; display:flex; align-items:center; justify-content:space-between;
    border-radius:8px; color:var(--ui-text); background:transparent; text-align:left; font-weight:500;
  }
  .select-option:hover,.select-option:focus-visible { background:var(--ui-hover); filter:none; }
  .select-option[aria-selected="true"] { color:var(--ui-accent); background:var(--ui-accent-soft); }
  .select-option[aria-selected="true"]::after { content:"\2713"; font-weight:800; }
  .account-row { padding:9px 0; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--ui-border-subtle); }
  .account-row:last-child { border-bottom:0; }
  .account-main { flex:1; min-width:0; }
  .account-actions { display:flex; gap:8px; }
  .empty-state { min-height:116px; display:grid; place-items:center; align-content:center; gap:12px; color:var(--ui-muted); }
  .group-title { margin-bottom:3px; color:var(--ui-muted); font-size:12px; font-weight:650; }
  .app-row { padding:10px 0; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--ui-border-subtle); }
  .app-row:last-child { border-bottom:0; }
  .app-row img { width:46px; height:46px; flex:none; border-radius:11px; background:var(--ui-input); }
  .app-info { flex:1; min-width:0; }
  .app-name { overflow:hidden; font-size:15px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
  .app-meta { overflow:hidden; color:var(--ui-muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
  .list-summary { margin-bottom:7px; color:var(--ui-muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .job-row { padding:9px 0; }
  .job-name { overflow:hidden; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
  .job-meta { overflow:hidden; color:var(--ui-muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
  .job-error { margin-top:5px; font-size:12px; }
  .swipe-row { position:relative; overflow:hidden; border-bottom:1px solid var(--ui-border-subtle); }
  .swipe-row:last-child { border-bottom:0; }
  .swipe-content { position:relative; transition:transform 180ms ease; }
  .swipe-action {
    position:absolute; top:0; bottom:0; right:-74px; width:74px; min-height:100%; margin:0; padding:0;
    display:flex; align-items:center; justify-content:center; border-radius:0;
    color:#fff; background:var(--ui-danger); font-weight:650; transition:transform 180ms ease;
  }
  .job-layout { display:flex; align-items:center; gap:10px; }
  .job-main { flex:1; min-width:0; }
  .job-status { width:70px; text-align:right; font-size:12px; }
  .bar { height:5px; min-width:120px; max-width:280px; flex:1; overflow:hidden; border-radius:99px; background:var(--ui-input); }
  .bar > i { display:block; height:100%; border-radius:99px; background:var(--ui-accent); transition:width .4s; }
  .bar > i.indet { width:38%; animation:indet 1.1s ease-in-out infinite alternate; }
  @keyframes indet { from { margin-left:0; } to { margin-left:62%; } }

  .file-list { border-top:1px solid var(--ui-border-subtle); }
  .file-row { min-height:52px; padding:7px 0; display:grid; grid-template-columns:38px minmax(0,1fr); align-items:center; gap:9px; }
  .file-icon { width:38px; height:38px; display:grid; place-items:center; overflow:hidden; border-radius:9px; color:var(--ui-accent); background:var(--ui-accent-soft); font-size:18px; font-weight:750; }
  .file-icon img { width:100%; height:100%; object-fit:cover; }
  .file-info { min-width:0; }
  .file-title { overflow:hidden; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
  .file-meta { overflow:hidden; color:var(--ui-muted); font-size:11.5px; text-overflow:ellipsis; white-space:nowrap; }
  .version-list { border-top:1px solid var(--ui-border-subtle); }
  .version-item {
    width:100%; min-height:56px; padding:9px 3px; display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:8px 14px;
    border-bottom:1px solid var(--ui-border-subtle); border-radius:0; color:var(--ui-text); background:transparent; text-align:left; font-weight:400;
  }
  .version-item:hover,.version-item:focus-visible { background:var(--ui-hover); filter:none; }
  .version-name { overflow:hidden; font-size:14px; font-weight:680; text-overflow:ellipsis; white-space:nowrap; }
  .version-id { margin-left:7px; padding:0; color:var(--ui-muted); background:transparent; font-size:11px; font-weight:450; }
  .version-meta { color:var(--ui-muted); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .version-chevron { color:var(--ui-muted); font-size:18px; line-height:1; }
  .version-sentinel { min-height:42px; display:grid; place-items:center; color:var(--ui-muted); font-size:12px; }
  .detail-hero { display:flex; align-items:center; gap:12px; padding:3px 0 14px; border-bottom:1px solid var(--ui-border-subtle); }
  .detail-hero img { width:58px; height:58px; flex:none; border-radius:13px; background:var(--ui-input); }
  .detail-title { margin:0 0 2px; font-size:18px; line-height:1.25; }
  .detail-grid { margin:12px 0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px 18px; }
  .detail-row { min-width:0; padding:8px 0; display:grid; grid-template-columns:88px minmax(0,1fr); gap:8px; border-bottom:1px solid var(--ui-border-subtle); }
  .detail-label { color:var(--ui-muted); font-size:12px; }
  .detail-value { overflow-wrap:anywhere; font-size:13px; text-align:right; }
  .release-notes { margin:2px 0 12px; padding:8px 0 11px; border-bottom:1px solid var(--ui-border-subtle); }
  .release-notes-title { margin-bottom:6px; color:var(--ui-muted); font-size:12px; font-weight:650; }
  .release-notes-content { margin:0; overflow-wrap:anywhere; white-space:pre-wrap; font-size:13px; line-height:1.55; }
  .detail-actions { display:flex; justify-content:flex-end; gap:8px; padding-top:3px; }
  .download-feedback { min-height:20px; margin-top:8px; color:var(--ui-muted); font-size:12px; text-align:right; }
  .download-feedback.err { color:var(--ui-danger); }
  button.is-loading:disabled { opacity:.9; }
  .button-spinner {
    display:inline-block; width:12px; height:12px; margin-right:7px; vertical-align:-2px;
    border:2px solid color-mix(in srgb,currentColor 35%,transparent); border-top-color:currentColor; border-radius:50%; animation:button-spin .7s linear infinite;
  }
  @keyframes button-spin { to { transform:rotate(360deg); } }

  .warn { margin-top:14px; padding:9px 12px; border:1px solid color-mix(in srgb,var(--ui-danger) 32%,transparent); border-left:3px solid var(--ui-danger); border-radius:9px; color:var(--ui-danger); background:var(--ui-surface); }
  .tab-bar {
    position:fixed; z-index:70; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); width:min(430px,calc(100vw - 28px)); min-height:62px;
    padding:6px; display:grid; grid-template-columns:repeat(3,1fr); gap:5px; transform:translateX(-50%);
    border:1px solid var(--ui-border); border-radius:22px; background:var(--ui-nav); box-shadow:0 14px 44px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter:blur(30px) saturate(190%); -webkit-backdrop-filter:blur(30px) saturate(190%);
  }
  .tab-button {
    min-height:48px; padding:5px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    border-radius:17px; color:var(--ui-muted); background:transparent; font-size:11px; font-weight:650;
  }
  .tab-button:hover { color:var(--ui-text); background:var(--ui-hover); filter:none; }
  .tab-button.active { color:var(--ui-accent); background:var(--ui-accent-soft); }
  .tab-button svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .modal-mask {
    position:fixed; inset:0; z-index:100; padding:16px; display:none; align-items:center; justify-content:center;
    background:var(--ui-backdrop); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); overscroll-behavior:contain;
  }
  .modal {
    position:relative; width:min(760px,94vw); max-height:88dvh; padding:17px; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    border:1px solid var(--ui-border); border-radius:16px; background:var(--ui-raised); box-shadow:var(--ui-shadow);
    backdrop-filter:blur(30px) saturate(175%); -webkit-backdrop-filter:blur(30px) saturate(175%);
  }
  .modal.compact { width:min(430px,94vw); }
  .modal h3 { min-height:30px; margin:0 38px 8px 0; display:flex; align-items:center; font-size:17px; }
  .modal:focus,.detail-title:focus { outline:none; }
  .modal .close {
    position:absolute; top:17px; right:17px; z-index:3; width:30px; height:30px; min-height:30px; margin:0; padding:0;
    display:grid; place-items:center; color:var(--ui-muted); background:var(--ui-input);
  }
  .login-form { display:flex; flex-direction:column; gap:12px; }
  .toast {
    position:fixed; z-index:200; top:14px; left:50%; display:none; max-width:calc(100vw - 24px); padding:8px 14px;
    transform:translateX(-50%); border:1px solid var(--ui-border); border-radius:999px; color:var(--ui-text); background:var(--ui-raised); box-shadow:var(--ui-shadow); font-size:14px;
    backdrop-filter:blur(24px) saturate(175%); -webkit-backdrop-filter:blur(24px) saturate(175%);
  }

  @media (max-width:680px) {
    .nav-inner { min-height:50px; padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left)); }
    main { padding:8px max(10px,env(safe-area-inset-right)) max(112px,calc(92px + env(safe-area-inset-bottom))) max(10px,env(safe-area-inset-left)); }
    section { margin-top:18px; }
    .sec-title { margin-left:1px; font-size:18px; }
    .card { padding:11px 12px; border-radius:11px; }
    button { min-height:40px; }
    input { font-size:16px; }
    .search-grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .search-grid > input { grid-column:1/-1; }
    .account-row { display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 10px; }
    .account-actions { grid-column:1/-1; }
    .account-actions button { flex:1; }
    .app-row { align-items:flex-start; gap:9px; }
    .app-row img { width:44px; height:44px; }
    .app-name,.app-meta { white-space:normal; overflow-wrap:anywhere; line-height:1.35; }
    .job-layout { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px 10px; }
    .job-layout .bar { grid-column:1/-1; grid-row:2; width:100%; max-width:none; }
    .job-status { width:auto; }
    .version-item { min-height:54px; grid-template-columns:minmax(0,1fr) auto; gap:3px 8px; }
    .version-item .version-meta { grid-column:1; }
    .version-chevron { grid-column:2; grid-row:1/3; }
    .version-id { margin-left:6px; }
    .detail-grid { grid-template-columns:1fr; }
    .detail-actions { display:grid; grid-template-columns:1fr 1fr; }
    .modal-mask { align-items:flex-end; padding:0; }
    .modal { width:100%; max-height:calc(100dvh - 6px); padding:14px 12px calc(14px + env(safe-area-inset-bottom)); border-radius:16px 16px 0 0; }
    .modal.compact { width:100%; }
    .modal .close { top:14px; right:12px; }
    .tab-bar { bottom:max(8px,env(safe-area-inset-bottom)); width:calc(100vw - 20px); min-height:60px; border-radius:20px; }
    .toast { top:auto; bottom:calc(18px + env(safe-area-inset-bottom)); width:max-content; border-radius:14px; text-align:center; }
  }
  @media (max-width:360px) {
    .browser-gate-address { align-items:stretch; flex-direction:column; }
    .browser-gate-address button { width:100%; }
    .file-row { grid-template-columns:34px minmax(0,1fr); }
    .file-icon { width:34px; height:34px; border-radius:8px; }
  }
  @media (max-width:380px) {
    .detail-actions { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
  }
</style>
</head>
<body class="browser-checking">
<div class="browser-gate hidden" id="browser-gate" role="alert">
  <div class="browser-gate-card">
    <div class="browser-gate-icon" id="browser-gate-icon">🧭</div>
    <h1>请使用 Safari 打开</h1>
    <p>当前浏览器不支持应用安装。请复制本页地址，并在 Safari 中打开。</p>
    <div class="browser-gate-address"><code id="safari-address"></code><button id="copy-safari-address" type="button" data-act="copy-safari-address">复制</button></div>
  </div>
</div>
<header class="nav">
  <div class="nav-inner">
    <span class="logo">📦</span><span class="brand">ipaDown</span><span class="spacer"></span>
    <div class="device-nav" id="device-nav">
      <button class="device-trigger" id="device-trigger" type="button" aria-label="设备：iPhone" aria-haspopup="listbox" aria-expanded="false" aria-controls="device-menu" data-act="toggle-device-menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect><path d="M10 5h4M11 18.5h2"></path></svg>
      </button>
      <div class="device-menu hidden" id="device-menu" role="listbox" aria-label="设备类型">
        <button type="button" class="device-menu-option" data-platform="iphone" role="option" aria-selected="true" data-act="select-platform"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.2"></rect><path d="M10 5h4M11 18.5h2"></path></svg><span>iPhone</span><span class="device-check">✓</span></button>
        <button type="button" class="device-menu-option" data-platform="ipad" role="option" aria-selected="false" data-act="select-platform"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2.2"></rect><path d="M11 18.5h2"></path></svg><span>iPad</span><span class="device-check">✓</span></button>
        <button type="button" class="device-menu-option" data-platform="appletv" role="option" aria-selected="false" data-act="select-platform"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M9 21h6M12 17v4"></path></svg><span>Apple TV</span><span class="device-check">✓</span></button>
      </div>
    </div>
    <button class="theme-btn" id="theme-btn" type="button" title="切换深浅色" aria-label="切换深浅色">🌙</button>
  </div>
</header>
<main>
  <div id="desktop-debug-banner" class="debug-notice hidden">桌面调试模式 · 安装仍须使用 Safari</div>
  <div id="https-warn" class="warn hidden">当前不是受信 HTTPS 地址，Safari 无法安装应用。请先配置 <code>PUBLIC_BASE_URL</code> 或 HTTPS 反向代理。</div>
  <div id="auth-banner" class="warn hidden">登录状态需要更新，请重新验证 Apple ID。 <button type="button" style="margin-left:10px" data-act="open-login">重新验证</button></div>
  <section class="app-panel hidden" id="panel-account" data-tab-panel="account">
    <div class="page-heading"><div class="sec-title">账户</div><button type="button" class="ghost" data-act="open-login">添加</button></div>
    <div class="card" id="accounts"><div class="dim">加载中…</div></div>
  </section>
  <section class="app-panel" id="panel-search" data-tab-panel="search">
    <div class="page-heading"><div class="sec-title">搜索</div></div>
    <div class="card">
      <div class="search-grid">
        <input id="search-term" aria-label="应用名称" placeholder="应用名称，如：微信">
        <div id="search-country-slot"></div>
        <button type="button" data-act="do-search">搜索</button>
      </div>
    </div>
    <div class="card hidden" id="search-card"><div id="search-results"></div></div>
  </section>
  <section class="app-panel hidden" id="panel-download" data-tab-panel="download">
    <div class="page-heading"><div class="sec-title">下载</div></div>
    <div class="card"><div class="group-title">任务</div><div id="jobs"><div class="dim">暂无任务</div></div></div>
    <div class="card"><div class="group-title">文件</div><div id="files"><div class="dim">暂无文件</div></div></div>
  </section>
</main>
<nav class="tab-bar" role="tablist" aria-label="主导航">
  <button type="button" class="tab-button" data-tab="account" role="tab" aria-selected="false" aria-controls="panel-account" data-act="show-tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c.7-4 2.8-6 6.5-6s5.8 2 6.5 6"></path></svg><span>账户</span>

    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path></svg><span>搜索</span>
  </button>
  <button type="button" class="tab-button" data-tab="download" role="tab" aria-selected="false" aria-controls="panel-download" data-act="show-tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11"></path><path d="m7.5 10 4.5 4.5 4.5-4.5"></path><path d="M4 19.5h16"></path></svg><span>下载</span>
  </button>
</nav>
<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal-box" role="dialog" aria-modal="true" aria-label="操作对话框" tabindex="-1">
    <button class="close" type="button" aria-label="关闭对话框" data-act="close-modal">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="browser-gate"><div class="browser-gate-card"><h1>需要启用 JavaScript</h1></div></div></noscript>

<script src="/app.js"></script>
</body>
</html>
